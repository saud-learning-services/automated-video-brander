name: automated-editor-py315
channels:
  - conda-forge
  - nodefaults  # don't mix in Anaconda "defaults" packages; they conflict with conda-forge
dependencies:
  - python=3.15
  - pip
  # data + Google Form
  - pandas>=3
  - numpy>=2
  - gspread
  - google-auth
  # Panopto
  - requests
  - requests-oauthlib
  - boto3
  # video
  - ffmpeg
  - ffmpeg-python
  - cairocffi
  - pillow
  - imageio
  - imageio-ffmpeg
  # misc
  - python-dotenv
  - termcolor
  - schedule
  - pip:
      - moviepy>=2.2,<3
      - gizeh==0.1.11
